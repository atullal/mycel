name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Is this a security vulnerability?** Then don't file it here. Report it privately:
        https://github.com/atullal/mycel/security/advisories/new (see SECURITY.md).

        Issues are public. Leave out contact codes, keys, message contents and anything else private.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. On device A, ...
        2. On device B, ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Every platform involved, if there's more than one device.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - iPhone or iPad
        - Android
        - Command line (mycel serve / keeper)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mycel build
      description: The release (e.g. dev-2026-10-09-apps) or the commit you built from. Every device should run the same build.
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: macOS 26.1, Windows 11 24H2, Ubuntu 24.04, iOS 26.0, Android 16
  - type: dropdown
    id: network
    attributes:
      label: How the devices were connected
      multiple: true
      options:
        - Same Wi-Fi or LAN
        - Internet
        - Peer-to-peer Wi-Fi
        - Bluetooth
        - No connection (offline)
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        mycel.log from the app's data folder, or the terminal output. Remove anything private first.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, how often it happens, what you've already tried.
