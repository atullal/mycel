# Builds the Mycel app for Linux and Windows (the Mac, iPhone/iPad and Android
# apps build on a Mac: scripts/package-*.sh), and runs the core tests there.
# Installers are attached to each run as artifacts.
name: Apps

on:
  workflow_dispatch:
  push:
    branches: [main, platforms]
    tags: ["dev-*", "v*"]

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

# Tagged runs attach the installers to the GitHub release of that tag.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Tauri's CLI from npm (prebuilt), same major as the tauri crate.
  TAURI_CLI: "@tauri-apps/cli@2"

jobs:
  linux:
    name: Linux app (deb, rpm, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          # webview + tray (Tauri), BlueZ D-Bus (Bluetooth link), ALSA (calls),
          # rpm and patchelf/fuse for the rpm and AppImage bundles.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libasound2-dev libssl-dev pkg-config patchelf rpm file libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        working-directory: apps/host
        run: npx --yes "$TAURI_CLI" build --bundles deb,rpm,appimage
      # Start the app on a virtual display: the runtime must open and the
      # app must still be running afterwards. The screenshot shows the UI.
      # If it hangs, every thread's stack is printed; a second try turns off
      # WebKit's GPU paths (DMA-BUF, compositing), which GPU-less machines
      # sometimes need.
      - name: Smoke test
        run: |
          sudo apt-get install -y xvfb imagemagick gdb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x860x24 &
          sleep 2
          attempt() {
            local dir="$RUNNER_TEMP/smoke-$1"; shift
            env MYCEL_DATA_DIR="$dir" "$@" target/release/mycel-host > "$dir.out" 2>&1 &
            local pid=$! started=$SECONDS
            # (~25 s here: GTK's GApplication startup waits on desktop D-Bus
            # services the bare runner lacks; desktop sessions answer at once.)
            for _ in $(seq 40); do
              grep -qs "mycel-host: data dir" "$dir/mycel.log" && break
              sleep 1
            done
            echo "== runtime opened after $((SECONDS - started)) s"
            sleep 10
            import -window root "$RUNNER_TEMP/mycel-linux.png" || true
            echo "== output"; cat "$dir.out"; echo "== mycel.log"; cat "$dir/mycel.log" 2>/dev/null || true
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; echo "== exited with status $?"; return 1
            fi
            if grep -qs "mycel-host: data dir" "$dir/mycel.log"; then
              kill "$pid"; return 0
            fi
            echo "== still starting after 50 s; threads:"
            sudo gdb -p "$pid" -batch -ex "thread apply all bt 25" 2>/dev/null | grep -E "^(#|Thread)" | head -200
            kill "$pid"; return 1
          }
          attempt plain || attempt no-gpu WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
      # Can WebKitGTK send video the way the app does (camera, WebCodecs
      # H.264)? There's no camera here: WebKit's mock capture device. First
      # with what the WebKitGTK package brings, then with GStreamer's extra
      # encoders, to see which a desktop needs. Reports only.
      - name: Video probe (WebKitGTK)
        continue-on-error: true
        run: |
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1
          xvfb-run -a python3 scripts/ci/video-probe-gtk.py && exit 0
          echo "== again with GStreamer's openh264 and x264 encoders"
          sudo apt-get install -y gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
          xvfb-run -a python3 scripts/ci/video-probe-gtk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-linux
          path: ${{ runner.temp }}/mycel-linux.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mycel-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "Builds of $GITHUB_REF_NAME."
          gh release upload "$GITHUB_REF_NAME" --clobber target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage

  windows:
    name: Windows app (installer, MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        working-directory: apps/host
        shell: bash
        run: npx --yes "$TAURI_CLI" build --bundles nsis,msi
      # The runtime must open and the app must still be running 25 s later.
      - name: Smoke test
        shell: pwsh
        run: |
          $env:MYCEL_DATA_DIR = "$env:RUNNER_TEMP\mycel-smoke"
          $p = Start-Process -FilePath target\release\mycel-host.exe -PassThru
          Start-Sleep 25
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\mycel-windows.png")
          } catch { Write-Host "no screenshot: $_" }
          Get-Content "$env:MYCEL_DATA_DIR\mycel.log"
          if (-not (Select-String -Path "$env:MYCEL_DATA_DIR\mycel.log" -Pattern "mycel-host: data dir" -Quiet)) { exit 1 }
          if ($p.HasExited) { Write-Error "Mycel exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
      # Can WebView2's engine send video the way the app does (camera,
      # WebCodecs H.264)? Headless Edge with Chromium's fake camera; the
      # page's title carries the result (read from the DevTools list).
      # Reports only.
      - name: Video probe (Edge, the engine under WebView2)
        continue-on-error: true
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $page = "file:///" + ((Resolve-Path scripts\ci\video-probe.html).Path -replace '\\', '/')
          Start-Process $edge -ArgumentList @("--headless=new", "--remote-debugging-port=9333",
            "--use-fake-device-for-media-stream", "--use-fake-ui-for-media-stream",
            "--user-data-dir=$env:RUNNER_TEMP\edge-probe", $page)
          $found = $null
          for ($i = 0; $i -lt 60 -and -not $found; $i++) {
            Start-Sleep 1
            try { $found = Invoke-RestMethod http://127.0.0.1:9333/json/list | Where-Object { $_.title -like "probe *" } | Select-Object -First 1 } catch {}
          }
          Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
          if (-not $found) { Write-Error "no result from the probe page"; exit 1 }
          $result = [System.Net.WebUtility]::HtmlDecode($found.title).Substring(6)  # the list escapes titles
          $result
          if (-not ($result | ConvertFrom-Json).ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows
          path: ${{ runner.temp }}/mycel-windows.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: mycel-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes "Builds of $GITHUB_REF_NAME."
          gh release upload "$GITHUB_REF_NAME" --clobber target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi

  test:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # The runtime and everything under it. (The simulator and benchmarks
      # are Unix dev tools; the host app is covered by the builds above.)
      # Optimised: some tests time real work (sync ingest, multipath
      # throughput) and a debug build on a small runner misses their bars.
      - name: Test
        shell: bash
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: |
          cargo test --no-fail-fast \
            -p mycel-crypto -p mycel-trust -p mycel-sync -p mycel-rules -p mycel-kit-chat \
            -p mycel-net -p mycel-link-iface -p mycel-link-ble -p mycel-call -p mycel-video -p mycel-node
