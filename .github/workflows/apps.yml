# Builds the Mycel app for Linux and Windows (the Mac, iPhone/iPad and Android
# apps build on a Mac: scripts/package-*.sh), and runs the core tests there.
# Installers are attached to each run as artifacts.
name: Apps

on:
  workflow_dispatch:
  push:
    branches: [main, platforms]
    tags: ["dev-*", "v*"]

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tauri's CLI from npm (prebuilt), same major as the tauri crate.
  TAURI_CLI: "@tauri-apps/cli@2"

jobs:
  linux:
    name: Linux app (deb, rpm, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          # webview + tray (Tauri), BlueZ D-Bus (Bluetooth link), ALSA (calls),
          # rpm and patchelf/fuse for the rpm and AppImage bundles.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libasound2-dev libssl-dev pkg-config patchelf rpm file libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        working-directory: apps/host
        run: npx --yes "$TAURI_CLI" build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: mycel-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows app (installer, MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        working-directory: apps/host
        shell: bash
        run: npx --yes "$TAURI_CLI" build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: mycel-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  test:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      # The runtime and everything under it. (The simulator and benchmarks
      # are Unix dev tools; the host app is covered by the builds above.)
      - name: Test
        shell: bash
        run: |
          cargo test --no-fail-fast \
            -p mycel-crypto -p mycel-trust -p mycel-sync -p mycel-rules -p mycel-kit-chat \
            -p mycel-net -p mycel-link-iface -p mycel-link-ble -p mycel-call -p mycel-video -p mycel-node
