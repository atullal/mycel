# Builds the Mycel app for Linux, Windows and macOS (the iPhone/iPad and
# Android apps build on a Mac: scripts/package-*.sh) and smoke-tests the first
# two. Installers are attached to each run as artifacts. A tag (dev-*, v*) also
# publishes them as a GitHub pre-release, with SHA256SUMS and a build
# provenance attestation:
#
#   gh attestation verify <downloaded file> --repo atullal/mycel
#
# The core tests run in the CI workflow (ci.yml).
name: Apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: all
        options: [all, macos]
  push:
    branches: [main]
    tags: ["dev-*", "v*"]

permissions: {}

concurrency:
  group: apps-${{ github.ref }}
  # Never cancel a release half-way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Tauri's CLI from npm (prebuilt), the same minor version as the tauri crate.
  TAURI_CLI: "@tauri-apps/cli@2.12.3"

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    name: Linux app (deb, rpm, AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          # webview + tray (Tauri), D-Bus, ALSA (calls),
          # rpm and patchelf/fuse for the rpm and AppImage bundles.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libasound2-dev libssl-dev pkg-config patchelf rpm file libfuse2
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      # No Rust or npm caches in this workflow: whatever it builds may be
      # published, so it builds from scratch (no cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # The web side: types, then the node:test suites of the SDK, Messaging
      # and the host (`npm test` runs each workspace's tests/*.test.ts with
      # Node's built-in TypeScript type stripping, Node 22.18 or later).
      - name: Web checks
        run: |
          npm run typecheck
          npm test
      # The host's own Rust tests (logging, notifications); they need the
      # webview libraries installed above, so they run here.
      - name: Host tests
        run: cargo test --locked -p mycel-host --lib
      - name: Build
        working-directory: apps/host
        run: |
          # Keep the runner's paths out of the binaries.
          source ../../scripts/remap-paths.sh
          npx --yes "$TAURI_CLI" build --bundles deb,rpm,appimage
      - name: No build-machine paths in the binary
        run: scripts/ci/check-build-paths.sh target/release/mycel-host
      # Start the app on a virtual display: the runtime must open and the
      # app must still be running afterwards. The screenshot shows the UI.
      # If it hangs, every thread's stack is printed; a second try turns off
      # WebKit's GPU paths (DMA-BUF, compositing), which GPU-less machines
      # sometimes need.
      - name: Smoke test
        run: |
          sudo apt-get install -y xvfb imagemagick gdb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x860x24 &
          sleep 2
          attempt() {
            local dir="$RUNNER_TEMP/smoke-$1"; shift
            env MYCEL_DATA_DIR="$dir" "$@" target/release/mycel-host > "$dir.out" 2>&1 &
            local pid=$! started=$SECONDS
            # (~25 s here: GTK's GApplication startup waits on desktop D-Bus
            # services the bare runner lacks; desktop sessions answer at once.)
            for _ in $(seq 40); do
              grep -qs "mycel-host: data dir" "$dir/mycel.log" && break
              sleep 1
            done
            echo "== runtime opened after $((SECONDS - started)) s"
            sleep 10
            import -window root "$RUNNER_TEMP/mycel-linux.png" || true
            echo "== output"; cat "$dir.out"; echo "== mycel.log"; cat "$dir/mycel.log" 2>/dev/null || true
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; echo "== exited with status $?"; return 1
            fi
            if grep -qs "mycel-host: data dir" "$dir/mycel.log"; then
              kill "$pid"; return 0
            fi
            echo "== still starting after 50 s; threads:"
            sudo gdb -p "$pid" -batch -ex "thread apply all bt 25" 2>/dev/null | grep -E "^(#|Thread)" | head -200
            kill "$pid"; return 1
          }
          attempt plain || attempt no-gpu WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
      # Can WebKitGTK send video the way the app does (camera, WebCodecs
      # H.264)? There's no camera here: WebKit's mock capture device. With
      # the GStreamer encoders the deb and rpm recommend (without them
      # WebKitGTK has no H.264 encoder).
      - name: Video probe (WebKitGTK)
        run: |
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
          xvfb-run -a python3 scripts/ci/video-probe-gtk.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot-linux
          path: ${{ runner.temp }}/mycel-linux.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycel-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    name: Windows app (installer, MSI)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Build
        working-directory: apps/host
        shell: bash
        run: |
          # Keep the runner's paths out of the binaries.
          source ../../scripts/remap-paths.sh
          npx --yes "$TAURI_CLI" build --bundles nsis,msi
      - name: No build-machine paths in the binary
        shell: bash
        run: scripts/ci/check-build-paths.sh target/release/mycel-host.exe
      # The runtime must open and the app must still be running 25 s later.
      - name: Smoke test
        shell: pwsh
        run: |
          $env:MYCEL_DATA_DIR = "$env:RUNNER_TEMP\mycel-smoke"
          $p = Start-Process -FilePath target\release\mycel-host.exe -PassThru
          Start-Sleep 25
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\mycel-windows.png")
          } catch { Write-Host "no screenshot: $_" }
          Get-Content "$env:MYCEL_DATA_DIR\mycel.log"
          if (-not (Select-String -Path "$env:MYCEL_DATA_DIR\mycel.log" -Pattern "mycel-host: data dir" -Quiet)) { exit 1 }
          if ($p.HasExited) { Write-Error "Mycel exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
      # Can WebView2's engine send video the way the app does (camera,
      # WebCodecs H.264)? Headless Edge with Chromium's fake camera.
      - name: Video probe (Edge, the engine under WebView2)
        shell: bash
        run: node scripts/ci/video-probe-chromium.mjs "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot-windows
          path: ${{ runner.temp }}/mycel-windows.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycel-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # The Mac app, for Apple silicon and Intel in one. Signed with the project's
  # Developer ID and notarised by Apple. Missing credentials fail the job
  # and block publication (docs/PLATFORMS.md, "Signing the Mac app").
  # Public releases and manual rehearsals use a fresh GitHub-hosted Mac.
  # MACOS_RUNNER may select the project's own Mac for branch-push builds.
  macos:
    name: macOS app (universal dmg)
    runs-on: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && vars.MACOS_RUNNER == 'self-hosted' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # The certificate goes into a keychain of its own, which only this job
      # uses and which is deleted at the end. Add it to the search list for
      # certificate-chain lookup, then restore the original list in cleanup.
      - name: Mac publication gate tests
        run: python3 -m unittest discover -s scripts/tests -p test_mac_release.py -v
      - name: Signing certificate
        id: certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE is required for public Mac downloads."
            exit 1
          fi
          keychain="$RUNNER_TEMP/mycel-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          # Publish the cleanup path before any keychain setup can fail.
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$password"
          security list-keychains -d user > "$RUNNER_TEMP/mycel-signing-keychains.txt.tmp"
          mv "$RUNNER_TEMP/mycel-signing-keychains.txt.tmp" "$RUNNER_TEMP/mycel-signing-keychains.txt"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 - "$keychain" "$RUNNER_TEMP/mycel-signing-keychains.txt" <<'PYTHON'
          import shlex, subprocess, sys
          with open(sys.argv[2]) as saved:
              original = shlex.split(saved.read())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", sys.argv[1], *original], check=True)
          PYTHON
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::APPLE_CERTIFICATE holds no Developer ID Application certificate with its private key"
            exit 1
          fi
          # Exercise actual key access before the expensive universal build.
          cp /usr/bin/true "$RUNNER_TEMP/mycel-signing-probe"
          codesign --force --timestamp --options runtime --sign "$identity" --keychain "$keychain" "$RUNNER_TEMP/mycel-signing-probe"
          codesign --verify --strict '-R=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$RUNNER_TEMP/mycel-signing-probe"
          rm -f "$RUNNER_TEMP/mycel-signing-probe"
          {
            echo "MYCEL_SIGN_IDENTITY=$identity"
            echo "MYCEL_SIGN_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
      # Either an App Store Connect API key (APPLE_API_KEY_P8, APPLE_API_KEY_ID,
      # APPLE_API_ISSUER) or an Apple ID (APPLE_ID, APPLE_APP_PASSWORD,
      # APPLE_TEAM_ID). Missing credentials block publication.
      - name: Notarisation credentials
        if: steps.certificate.outputs.keychain != ''
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$API_KEY_P8" ]; then
            : "${API_KEY_ID:?Missing APPLE_API_KEY_ID}" "${API_ISSUER:?Missing APPLE_API_ISSUER}"
            printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            {
              echo "MYCEL_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "MYCEL_NOTARY_KEY_ID=$API_KEY_ID"
              echo "MYCEL_NOTARY_ISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ]; then
            : "${APP_PASSWORD:?Missing APPLE_APP_PASSWORD}" "${TEAM_ID:?Missing APPLE_TEAM_ID}"
            {
              echo "MYCEL_NOTARY_APPLE_ID=$APPLE_ID"
              echo "MYCEL_NOTARY_PASSWORD=$APP_PASSWORD"
              echo "MYCEL_NOTARY_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Notarization credentials are required for public Mac downloads."
            exit 1
          fi
      - name: Build
        run: scripts/package-mac.sh --universal
      - name: No build-machine paths in the binary
        run: scripts/ci/check-build-paths.sh target/universal-apple-darwin/release/mycel-host
      - name: Remove the signing keychain and key
        if: always()
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: |
          if [ -f "$RUNNER_TEMP/mycel-signing-keychains.txt" ]; then
            python3 - "$RUNNER_TEMP/mycel-signing-keychains.txt" <<'PYTHON'
          import shlex, subprocess, sys
          with open(sys.argv[1]) as saved:
              original = shlex.split(saved.read())
          subprocess.run(["security", "list-keychains", "-d", "user", "-s", *original], check=True)
          PYTHON
          fi
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/mycel-signing-probe" \
            "$RUNNER_TEMP/mycel-signing-keychains.txt" "$RUNNER_TEMP/mycel-signing-keychains.txt.tmp"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycel-macos
          path: |
            dist-release/Mycel_*_universal_notarized.dmg
            dist-release/Mycel_*_universal_notarized.app.zip
          if-no-files-found: error

  # Tags only. Runs no project code: it takes the installers the jobs above
  # built, checksums them, attests their provenance and publishes them. The
  # only job with write access.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mycel-*
          path: ${{ runner.temp }}/artifacts
      - name: Collect the installers and checksum them
        run: |
          mkdir dist
          find "$RUNNER_TEMP/artifacts" -type f -exec mv -t dist -- {} +
          test -s dist/Mycel_*_universal_notarized.dmg
          test -s dist/Mycel_*_universal_notarized.app.zip
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Builds of $TAG. The universal Mac app and DMG are Developer ID signed and notarized by Apple. Check a download against SHA256SUMS, and its provenance with: gh attestation verify <file> --repo $GH_REPO"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release made by hand before this run: add the files to it.
            gh release upload "$TAG" --clobber dist/*
          else
            # Created as a draft with every file, then published, so it also
            # works with immutable releases (no files added after publishing).
            gh release create "$TAG" --draft --verify-tag --prerelease --title "$TAG" --notes "$notes" dist/*
            gh release edit "$TAG" --draft=false
          fi
