# Builds the Mycel app for Linux and Windows (the Mac, iPhone/iPad and Android
# apps build on a Mac: scripts/package-*.sh) and smoke-tests it. Installers
# are attached to each run as artifacts. A tag (dev-*, v*) also publishes them
# as a GitHub pre-release, with SHA256SUMS and a build provenance attestation:
#
#   gh attestation verify <downloaded file> --repo atullal/mycel
#
# The core tests run in the CI workflow (ci.yml).
name: Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["dev-*", "v*"]

permissions: {}

concurrency:
  group: apps-${{ github.ref }}
  # Never cancel a release half-way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Tauri's CLI from npm (prebuilt), the same minor version as the tauri crate.
  TAURI_CLI: "@tauri-apps/cli@2.12.3"

jobs:
  linux:
    name: Linux app (deb, rpm, AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          # webview + tray (Tauri), D-Bus, ALSA (calls),
          # rpm and patchelf/fuse for the rpm and AppImage bundles.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libasound2-dev libssl-dev pkg-config patchelf rpm file libfuse2
      # The toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      # No Rust or npm caches in this workflow: whatever it builds may be
      # published, so it builds from scratch (no cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # The web side: types, then the node:test suites of the SDK, Messaging
      # and the host (`npm test` runs each workspace's tests/*.test.ts with
      # Node's built-in TypeScript type stripping, Node 22.18 or later).
      - name: Web checks
        run: |
          npm run typecheck
          npm test
      # The host's own Rust tests (logging, notifications); they need the
      # webview libraries installed above, so they run here.
      - name: Host tests
        run: cargo test --locked -p mycel-host --lib
      # The release binary is built per package: no crate in it may get the
      # model checker's or the simulator's test-only features.
      - name: No test-only features
        run: scripts/ci/check-release-features.sh mycel-host
      - name: Build
        working-directory: apps/host
        run: |
          # Keep the runner's paths out of the binaries.
          source ../../scripts/remap-paths.sh
          npx --yes "$TAURI_CLI" build --bundles deb,rpm,appimage
      - name: No build-machine paths in the binary
        run: scripts/ci/check-build-paths.sh target/release/mycel-host
      # Start the app on a virtual display: the runtime must open and the
      # app must still be running afterwards. The screenshot shows the UI.
      # If it hangs, every thread's stack is printed; a second try turns off
      # WebKit's GPU paths (DMA-BUF, compositing), which GPU-less machines
      # sometimes need.
      - name: Smoke test
        run: |
          sudo apt-get install -y xvfb imagemagick gdb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x860x24 &
          sleep 2
          attempt() {
            local dir="$RUNNER_TEMP/smoke-$1"; shift
            env MYCEL_DATA_DIR="$dir" "$@" target/release/mycel-host > "$dir.out" 2>&1 &
            local pid=$! started=$SECONDS
            # (~25 s here: GTK's GApplication startup waits on desktop D-Bus
            # services the bare runner lacks; desktop sessions answer at once.)
            for _ in $(seq 40); do
              grep -qs "mycel-host: data dir" "$dir/mycel.log" && break
              sleep 1
            done
            echo "== runtime opened after $((SECONDS - started)) s"
            sleep 10
            import -window root "$RUNNER_TEMP/mycel-linux.png" || true
            echo "== output"; cat "$dir.out"; echo "== mycel.log"; cat "$dir/mycel.log" 2>/dev/null || true
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; echo "== exited with status $?"; return 1
            fi
            if grep -qs "mycel-host: data dir" "$dir/mycel.log"; then
              kill "$pid"; return 0
            fi
            echo "== still starting after 50 s; threads:"
            sudo gdb -p "$pid" -batch -ex "thread apply all bt 25" 2>/dev/null | grep -E "^(#|Thread)" | head -200
            kill "$pid"; return 1
          }
          attempt plain || attempt no-gpu WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
      # Can WebKitGTK send video the way the app does (camera, WebCodecs
      # H.264)? There's no camera here: WebKit's mock capture device. With
      # the GStreamer encoders the deb and rpm recommend (without them
      # WebKitGTK has no H.264 encoder).
      - name: Video probe (WebKitGTK)
        run: |
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
          xvfb-run -a python3 scripts/ci/video-probe-gtk.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot-linux
          path: ${{ runner.temp }}/mycel-linux.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycel-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows app (installer, MSI)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: No test-only features
        shell: bash
        run: scripts/ci/check-release-features.sh mycel-host
      - name: Build
        working-directory: apps/host
        shell: bash
        run: |
          # Keep the runner's paths out of the binaries.
          source ../../scripts/remap-paths.sh
          npx --yes "$TAURI_CLI" build --bundles nsis,msi
      - name: No build-machine paths in the binary
        shell: bash
        run: scripts/ci/check-build-paths.sh target/release/mycel-host.exe
      # The runtime must open and the app must still be running 25 s later.
      - name: Smoke test
        shell: pwsh
        run: |
          $env:MYCEL_DATA_DIR = "$env:RUNNER_TEMP\mycel-smoke"
          $p = Start-Process -FilePath target\release\mycel-host.exe -PassThru
          Start-Sleep 25
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\mycel-windows.png")
          } catch { Write-Host "no screenshot: $_" }
          Get-Content "$env:MYCEL_DATA_DIR\mycel.log"
          if (-not (Select-String -Path "$env:MYCEL_DATA_DIR\mycel.log" -Pattern "mycel-host: data dir" -Quiet)) { exit 1 }
          if ($p.HasExited) { Write-Error "Mycel exited with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id
      # Can WebView2's engine send video the way the app does (camera,
      # WebCodecs H.264)? Headless Edge with Chromium's fake camera.
      - name: Video probe (Edge, the engine under WebView2)
        shell: bash
        run: node scripts/ci/video-probe-chromium.mjs "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshot-windows
          path: ${{ runner.temp }}/mycel-windows.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycel-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Tags only. Runs no project code: it takes the installers the jobs above
  # built, checksums them, attests their provenance and publishes them. The
  # only job with write access.
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mycel-*
          path: ${{ runner.temp }}/artifacts
      - name: Collect the installers and checksum them
        run: |
          mkdir dist
          find "$RUNNER_TEMP/artifacts" -type f -exec mv -t dist -- {} +
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Builds of $TAG. Check a download against SHA256SUMS, and its provenance with: gh attestation verify <file> --repo $GH_REPO"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release made by hand before this run: add the files to it.
            gh release upload "$TAG" --clobber dist/*
          else
            # Created as a draft with every file, then published, so it also
            # works with immutable releases (no files added after publishing).
            gh release create "$TAG" --draft --verify-tag --prerelease --title "$TAG" --notes "$notes" dist/*
            gh release edit "$TAG" --draft=false
          fi
