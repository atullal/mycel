# Checks for every pull request, merge-queue entry and push to main.
# Branch protection needs one required check: "CI result" (the last job),
# which passes only when every job it lists passed.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      # Both workspaces; vendor/ is excluded by vendor/rustfmt.toml.
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path rules/Cargo.toml

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webview and tray (Tauri), D-Bus, ALSA (calls)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libasound2-dev libssl-dev pkg-config
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: |
          # The simulator and benchmarks are Unix dev tools.
          exclude=()
          if [ "$RUNNER_OS" = Windows ]; then exclude=(--exclude mycel-sim --exclude mycel-bench); fi
          cargo clippy --locked --workspace "${exclude[@]}" --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runtime and everything under it. The host app is tested by the
      # Apps workflow (it needs the webview libraries); the simulator and
      # benchmarks are dev tools.
      # Optimised: some tests time real work (sync ingest, multipath
      # throughput) and a debug build on a small runner misses their bars.
      # Even so, a different timing test can miss its deadline in each run:
      # failed tests are retried twice, and one that passes on a retry shows
      # as a "Flaky test" warning (scripts/ci/retry-failed.py). The security
      # suites also run in the "Security regressions" job, without retries.
      - name: Test
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "2"
        run: |
          set -o pipefail
          # macOS asks before a process may use the local network, and a CI
          # runner can't answer: these LAN discovery tests run on Linux and
          # Windows only.
          skip=()
          if [ "$RUNNER_OS" = macOS ]; then
            skip=(--skip lan_discovery_via_mdns --skip one_path_per_interface --skip sync_over_an_interface_with_ip_off)
          fi
          cargo test --locked --no-fail-fast \
            -p mycel-crypto -p mycel-trust -p mycel-sync -p mycel-rules -p mycel-kit-chat \
            -p mycel-net -p mycel-link-iface -p mycel-link-ble -p mycel-call -p mycel-video -p mycel-node \
            -- "${skip[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log" && exit 0
          echo "== retrying the failed tests"
          "$(command -v python3 || command -v python)" scripts/ci/retry-failed.py "$RUNNER_TEMP/test.log"

  security:
    name: Security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No retries: a security regression must stay a failure.
      - name: Crypto, trust, sync and rules
        run: cargo test --locked --lib -p mycel-crypto -p mycel-trust -p mycel-sync -p mycel-rules
      - name: Untrusted blobs and attachments
        run: |
          cargo test --locked -p mycel-net --test blob_security
          cargo test --locked -p mycel-node --test attachment_security

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # TODO: set RUSTDOCFLAGS=-D warnings once the existing broken intra-doc
      # links and unescaped HTML in doc comments are fixed.
      - run: cargo doc --locked --no-deps --workspace --exclude mycel-host

  rules:
    name: Rules (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml adds the wasm32-unknown-unknown target.
      - run: rustup toolchain install --no-self-update
      - name: Clippy
        working-directory: rules
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      # Rebuild the guest bundles into the host's fixtures, then run the host
      # against them.
      - name: Build the rules bundles
        run: rules/build.sh
      - name: Rules runtime tests
        run: cargo test --locked -p mycel-rules

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      # Advisories, licences, bans and sources (deny.toml).
      - run: cargo deny --locked check
      - name: Rules workspace
        run: |
          cargo deny --locked --manifest-path rules/Cargo.toml --target wasm32-unknown-unknown check \
            -A license-exception-not-encountered -A license-not-encountered -A advisory-not-detected

  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # node:test suites of the SDK, Messaging and the host, with Node's
      # built-in TypeScript type stripping (Node 22.18 or later).
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every commit in the pull request needs a Signed-off-by line
      # (`git commit -s`; CONTRIBUTING.md).
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::commit $commit has no Signed-off-by line: amend it with git commit --amend -s, or git rebase --signoff"
              status=1
            fi
          done
          exit "$status"

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          # The runner's preinstalled ShellCheck also checks every run: script.
          "$RUNNER_TEMP/actionlint" -color
      - uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          version: 1.31.0
          inputs: .github/workflows .github/dependabot.yml
          advanced-security: false

  gradle-wrapper:
    name: Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checked-in gradle-wrapper.jar must be an official Gradle build.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  result:
    name: CI result
    if: always()
    needs: [fmt, clippy, test, security, docs, rules, deny, web, dependency-review, dco, typos, workflows, gradle-wrapper]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a required job ended with: $result"; exit 1 ;;
            esac
          done
