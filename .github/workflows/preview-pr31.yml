name: Preview Mycel PR 31
on:
  push:
    branches: [preview/pr-31-render]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 796decd2c272e89e9063de0769d63f2aabbd735f
          persist-credentials: false
      - name: Build and render the proposed site
        run: |
          node site/build.mjs
          python3 -m http.server 4178 --bind 127.0.0.1 --directory site/dist >/tmp/site.log 2>&1 &
          d=$(mktemp -d)
          npm install --prefix "$d" --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$d/node_modules" node <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true});
            for(const [name,width,height,theme] of [['desktop',1440,1000,'light'],['mobile',390,844,'light'],['mobile-dark',390,844,'dark']]){
              const page=await browser.newPage({viewport:{width,height},colorScheme:theme,reducedMotion:'reduce'});
              const errors=[];page.on('pageerror', e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4178/',{waitUntil:'networkidle'});
              await page.locator('picture img').evaluateAll(async imgs=>{await Promise.all(imgs.map(img=>{img.loading='eager';return img.decode()}))});
              assert(await page.locator('h1').isVisible());
              assert.equal(await page.locator('.hero .button:visible').count(),1);
              await page.locator('.tick.on').waitFor({state:'attached'});
              const sizes=await page.evaluate(()=>({page:document.documentElement.scrollWidth,viewport:innerWidth,hero:document.querySelector('h1').getBoundingClientRect().toJSON(),map:document.querySelector('.mesh').getBoundingClientRect().toJSON(),images:[...document.querySelectorAll('picture img')].map(x=>[x.naturalWidth,x.naturalHeight])}));
              assert(sizes.page<=width);console.log(name,JSON.stringify(sizes));
              const img=await page.screenshot({type:'jpeg',quality:68,path:name+'.jpg'});
              // Small image chunks keep the screenshot retrievable from the QA job.
              const encoded=img.toString('base64');
              for(let i=0;i<encoded.length;i+=3500)console.log('PREVIEW_IMAGE '+name+' '+i+' '+encoded.slice(i,i+3500));
              await page.locator('[data-id=hana]').click();
              assert((await page.locator('#mesh-say').innerText()).includes('Tobias'));
              assert.deepEqual(errors,[]);await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
