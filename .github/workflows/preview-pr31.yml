name: Preview Mycel PR 31
on:
  push:
    branches: [preview/pr-31-render]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5c7530211d0dca536e3143e09ffacf1234c418f0
          persist-credentials: false
      - name: Test globe and download offers
        run: |
          node site/build.mjs
          python3 -m http.server 4178 --bind 127.0.0.1 --directory site/dist >/tmp/site.log 2>&1 &
          d=$(mktemp -d)
          npm install --prefix "$d" --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$d/node_modules" node <<'JS'
          const { chromium } = require('playwright-core');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser = await chromium.launch({channel:'chrome',headless:true});
            for(const [name,ua,platform,touch,expected] of [
              ['desktop','Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)','MacIntel',0,'mac'],
              ['mobile','Mozilla/5.0 (Linux; Android 15; Pixel 9)','Linux armv8l',5,'android'],
              ['Windows','Mozilla/5.0 (Windows NT 10.0; Win64; x64)','Win32',0,'windows'],
              ['Linux','Mozilla/5.0 (X11; Linux x86_64)','Linux x86_64',0,'linux'],
              ['iPhone','Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)','iPhone',5,'ios'],
              ['iPad','Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15)','MacIntel',5,'ios'],
              ['ChromeOS','Mozilla/5.0 (X11; CrOS x86_64 15474.61.0)','Linux x86_64',0,'choose'],
              ['Unknown','Unknown','','0','choose']
            ]){
              const width=touch?390:1440;
              const page=await browser.newPage({viewport:{width,height:touch?844:900},userAgent:ua,reducedMotion:name==='desktop'?'no-preference':'reduce'});
              await page.addInitScript(([platform,touch])=>{
                Object.defineProperties(navigator,{platform:{get:()=>platform},maxTouchPoints:{get:()=>Number(touch)},userAgentData:{get:()=>undefined}});
              },[platform,touch]);
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4178/',{waitUntil:'networkidle'});
              const button=page.locator('.hero .button:visible');
              assert.equal(await button.count(),1);
              assert.equal(await button.getAttribute('data-system'),expected);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth),width);
              for(const kind of ['file','chat']){
                await page.locator('[data-send='+kind+']').click();
                if(name==='desktop')await page.waitForFunction(kind=>document.querySelector('.'+kind+' .packets').getAttribute('visibility')==='visible',kind);
                await page.waitForFunction(()=>document.querySelector('[role=status]').textContent.includes('delivered'));
                assert.equal(await page.locator('.'+kind+' .arrival').getAttribute('visibility'),null);
              }
              assert.deepEqual(errors,[]); console.log('PASS',name,await button.innerText());
              if(['desktop','mobile'].includes(name)){
                await page.evaluate(()=>scrollTo({top:0,behavior:'instant'}));
                const data=(await page.screenshot({type:'jpeg',quality:75})).toString('base64');
                for(let i=0;i<data.length;i+=3500) console.log('GLOBE_IMG '+name+' '+i+' '+data.slice(i,i+3500));
              }
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
