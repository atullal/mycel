version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
mycel-rules-guest = { path = "../mycel-rules-guest" }
mycel-rules-abi = { path = "../../crates/mycel-rules-abi", features = ["chat"] }
