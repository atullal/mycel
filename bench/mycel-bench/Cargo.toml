[package]
name = "mycel-bench"
description = "Replays external benchmark inputs (contact traces, Meshtasticator topologies) through Mycel's sans-IO routing and store-and-forward cores."
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "dtn-replay"
path = "src/dtn_replay.rs"

[[bin]]
name = "mesh-routing"
path = "src/mesh_routing.rs"

[[bin]]
name = "route-check"
path = "src/route_check.rs"

[dependencies]
bytes = "1.12"
serde_json = "1.0.151"
mycel-crypto = { version = "0.1.0", path = "../../crates/mycel-crypto" }
mycel-net = { version = "0.1.0", path = "../../crates/mycel-net" }
