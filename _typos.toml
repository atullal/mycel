# typos (https://github.com/crate-ci/typos): spelling in code, comments and docs.
#   typos            # check
#   typos --write-changes
# Add a word here only when it is right (a name, an abbreviation), with a note.

[files]
extend-exclude = [
  # Upstream code, kept byte-for-byte (THIRD_PARTY_NOTICES.md).
  "vendor/",
  # Generated files and data.
  "*.lock",
  "package-lock.json",
  "*.pbxproj",
  "*.storyboard",
  "*.svg",
  "bench/results/",
  "crates/mycel-sync/src/fixtures/",
  # Fuzzing inputs, named after their hashes.
  "fuzz/seeds/",
]

[default]
extend-ignore-re = [
  # Base64url data pinned in tests (contact codes, keys): 40 or more
  # characters with no word break are data, not words.
  "[A-Za-z0-9_-]{40,}",
]

[default.extend-identifiers]
# ancestor (crates/mycel-trust)
anc = "anc"
# mach_timebase_info_data_t's numerator field (crates/mycel-video/src/realtime.rs)
numer = "numer"
# buffers a and b (tests)
ba = "ba"

[default.extend-words]
# retransmission timeout
rto = "rto"
# UPnP
pn = "pn"
# Big Sur (macOS 11)
sur = "sur"
# a name in the SDK's mock data
ines = "ines"
# zlib's DEFLATE crates (flate2)
flate = "flate"
# ablation: the simulator's ABL_VARIANTS (crates/mycel-sim/examples/ablation.rs)
abl = "abl"
