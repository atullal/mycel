[package]
name = "mycel-host"
description = "The Mycel Host: one native shell for every Mycel app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "mycel_host"
path = "src/lib.rs"
# staticlib for the iOS app, cdylib for Android, rlib for the desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mycel-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mycel-node = { path = "../../../crates/mycel-node" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
data-encoding = "2"
serde_json = "1"
# libc 0.2.190 declares the routing-socket constants and `in6_ifreq` for macOS
# only, which breaks Iroh's `netwatch` and `netdev` on iOS. Stay below it until
# they stop relying on those items there.
libc = ">=0.2.189, <0.2.190"
tokio = { version = "1", features = ["sync"] }

# The device's name for a new profile, and the share sheet for attachments.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "UIActivityViewController", "UIApplication", "UIDevice", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIView", "UIViewController"] }

# Calls into MainActivity and MycelService (attachments, notifications, a
# window for a reopened activity).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# WebKitGTK's camera capture is off unless turned on (the page captures for
# calls). The version and feature Tauri uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true
