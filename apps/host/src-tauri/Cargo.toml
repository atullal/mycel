[package]
name = "mycel-host"
version = "0.1.0"
description = "The Mycel Host: one native shell for every Mycel app"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "mycel_host"
path = "src/lib.rs"

[[bin]]
name = "mycel-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mycel-node = { path = "../../../crates/mycel-node" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["sync"] }
