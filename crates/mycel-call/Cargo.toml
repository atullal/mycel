[package]
name = "mycel-call"
description = "Live voice calls for Mycel: Opus over QUIC datagrams on the multipath fabric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Never published: it builds against the patched crates in vendor/, which a
# crates.io copy would silently replace with unpatched upstream.
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.12"
cpal = "0.16"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-net = { version = "0.1.0", path = "../mycel-net" }
mycel-video = { version = "0.0.1", path = "../mycel-video" }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc"] }
rtrb = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["sync", "time", "rt", "macros"] }
# libopus 1.3.1 translated to Rust (c2rust): no C toolchain, builds for every
# target the universal macOS app needs.
unsafe-libopus = "0.2.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AUComponent", "AudioComponent", "AudioOutputUnit", "AudioUnitProperties", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

# Call audio with the phone's echo canceller (AAudio's voice-communication
# preset, Android 9+), and the microphone permission check.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-28"] }
ndk-context = "0.1"

[dev-dependencies]
parking_lot = "0.12.5"
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
tokio = { version = "1.53.2", features = ["full"] }
