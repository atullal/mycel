[package]
name = "mycel-link-awdl"
description = "Mycel link over Apple peer-to-peer Wi-Fi (AWDL), via Network.framework + Bonjour"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Never published: it builds against the patched crates in vendor/, which a
# crates.io copy would silently replace with unpatched upstream.
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.12"
hex = "0.4.3"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-net = { version = "0.1.0", path = "../mycel-net" }
parking_lot = "0.12.5"
tokio = { version = "1.53.2", features = ["sync"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6.2"
libc = "0.2.189"

[dev-dependencies]
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[lints]
workspace = true
