[package]
name = "mycel-trust"
description = "Mycel trust layer: Spaces as DAGs of signed membership ops, resolved deterministically"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[features]
# Exposes the from-scratch resolver (`mycel_trust::oracle`) for the
# before/after benchmark. Tests always have it.
oracle = []

[[bench]]
name = "resolve"
harness = false
required-features = ["oracle"]

[[bench]]
name = "adversarial"
harness = false
required-features = ["oracle"]

[lints]
workspace = true
