[package]
name = "mycel-node"
description = "Mycel runtime: one device's facade over the crypto, trust, sync, net and chat layers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Never published: it builds against the patched crates in vendor/, which a
# crates.io copy would silently replace with unpatched upstream.
publish = false

[dependencies]
anyhow = "1.0.104"
data-encoding = "2.11.1"
hex = "0.4.3"
mycel-call = { version = "0.0.1", path = "../mycel-call" }
mycel-video = { version = "0.0.1", path = "../mycel-video" }
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-kit-chat = { version = "0.0.1", path = "../mycel-kit-chat" }
mycel-link-awdl = { version = "0.1.0", path = "../mycel-link-awdl" }
mycel-link-ble = { path = "../mycel-link-ble" }
mycel-link-iface = { path = "../mycel-link-iface" }
mycel-net = { version = "0.1.0", path = "../mycel-net", features = ["dht"] }
mycel-rules = { version = "0.1.0", path = "../mycel-rules" }
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Only to mark downloads with com.apple.quarantine (xattr doesn't build on Windows).
[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"

# Secure no-follow opens and Android device model.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = { version = "0.8.7", features = ["mac_os_10_8_features"] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[dev-dependencies]
anyhow = "1.0.104"
mycel-sync = { path = "../mycel-sync" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }

[lints]
workspace = true
