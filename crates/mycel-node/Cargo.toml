[package]
name = "mycel-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
hex = "0.4.3"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-kit-chat = { version = "0.0.1", path = "../mycel-kit-chat" }
mycel-net = { version = "0.1.0", path = "../mycel-net" }
mycel-rules = { version = "0.1.0", path = "../mycel-rules" }
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
xattr = "1.6.1"

[dev-dependencies]
anyhow = "1.0.104"
mycel-sync = { path = "../mycel-sync" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
