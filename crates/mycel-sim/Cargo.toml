[package]
name = "mycel-sim"
description = "Real-world network simulation for Mycel: real nodes over emulated radios and wires (tier 1), and a discrete-event routing simulator for 100k+ devices (tier 2)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mycel-sim"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
mycel-call = { version = "0.0.1", path = "../mycel-call" }
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-net = { version = "0.1.0", path = "../mycel-net" }
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
parking_lot = "0.12.5"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full", "test-util"] }
