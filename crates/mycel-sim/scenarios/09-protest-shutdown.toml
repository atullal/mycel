# 9. Protest during a national internet shutdown: dense, hostile, dying phones.
number = 9
name = "protest-shutdown"
title = "Protest with national internet shutdown"
proves = "Mesh under hostile density"
key_physics = ["crowd 2–5 people/m²", "body loss", "aggregate interference", "cellular down", "BLE jamming at 1–5% of area", "infiltrators (liars, Sybils 1–5%)", "phones dying"]

[size]
people = 50000
ci_people = 3000
adoption = 0.05
duration_min = 180
ci_duration_min = 60

[region]
layout = "field"
width_m = 150
height_m = 150
env = "crowd"
latlon = [41.01, 28.98]

[mobility]
model = "waypoint"
share = 0.3
speed_mps = 0.5
pause_s = 300

[internet]
share = 0.6
access = "cellular"
[[internet.outages]]
at_min = 10
scope = "all"

[os]
battery_median_h = 6

[[adversaries]]
role = "liar"
share = 0.02

[[adversaries]]
role = "attested-liar"
share = 0.01

[workload]
per_device_hour = 4
dest = "any"

[objectives]
delivery_min = 0.9
latency_p95_max_s = 60

[uq]
parameters = ["range_mult", "adoption", "adversary_share", "max_neighbours", "walk_speed", "battery_median_h", "msg_rate"]
[uq.bounds]
walk_speed = [0.3, 1.0]
battery_median_h = [2.0, 12.0]
[[uq.correlate]]
a = "battery_median_h"
b = "msg_rate"
rho = -0.5
why = "more traffic keeps radios busy and drains batteries sooner (estimate of the strength)"

[swarm]
toggles = ["fisheye", "flood-reduction", "dtn", "outages", "adversaries", "battery"]

[[needs]]
model = "sinr-aggregate"
essential = true
why = "thousands of radios in a square: many weak interferers add up (1,000 × −10 dB = +20 dB)"

[[needs]]
model = "body-loss"
essential = true
why = "at 2–5 people/m² bodies block most line-of-sight paths"

[[needs]]
model = "jamming"
essential = true
why = "authorities jam BLE over 1–5% of the area"

[[needs]]
model = "radio-sybil"
why = "infiltrators may run many identities on one radio"

[[needs]]
model = "crowd-flow"
why = "crowds move at density-dependent speeds"
