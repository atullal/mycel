# 5. Rural village with one Starlink terminal and walkers between houses.
number = 5
name = "rural-starlink"
title = "Rural village, one Starlink gateway"
proves = "Gateway choice, DTN with mules"
key_physics = ["outdoor path loss n ≈ 2", "sparse houses", "Starlink access"]

[size]
people = 150
ci_people = 150
adoption = 0.6
duration_min = 240
ci_duration_min = 120

[region]
layout = "clusters"
width_m = 2000
height_m = 2000
env = "outdoor"
clusters = 6
cluster_radius_m = 60
latlon = [-1.29, 36.82]

[mobility]
model = "mules"
share = 0.1
speed_mps = 1.3
pause_s = 600

[internet]
gateways = 1
access = "satellite"
abroad = 4

[workload]
per_device_hour = 1
dest = "abroad"
drain_min = 30

[objectives]
delivery_min = 0.8
latency_p95_max_s = 3600

[uq]
parameters = ["range_mult", "mule_share", "walk_speed", "pause_s"]

[[needs]]
model = "shadowing"
why = "terrain and trees between houses"

[[needs]]
model = "geo-satellite"
why = "Starlink is 40–50 ms median; the slow-access stand-in is 300 ms (pessimistic on latency)"
