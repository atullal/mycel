[package]
name = "mycel-net"
description = "Mycel network layer: Spaces over Iroh QUIC, with live sync, discovery, invites and blobs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Never published: it builds against the patched crates in vendor/, which a
# crates.io copy would silently replace with unpatched upstream.
publish = false

[features]
# Publish and resolve gateway records on the BitTorrent Mainline DHT.
dht = ["dep:n0-mainline"]
# Read-only views of the sans-IO cores' state (and one planted bug) for the
# bounded model checker, crates/mycel-check. Never on in a release build.
model = []
# In-code fault injection (`buggify!`, src/buggify.rs) for simulation. Off,
# every injection point compiles to `false`; on, it still fires only after
# `buggify::enable`. Never on in a release build.
sim = []

[dependencies]
anyhow = "1.0.104"
iroh = { version = "1.3", features = ["unstable-custom-transports"] }
iroh-base = "1.3"
iroh-dns = "1.3"
n0-mainline = { version = "0.7", optional = true }
url = "2.5"
bytes = "1.12"
n0-watcher = "1.0"
noq-udp = "1.3"
iroh-mdns-address-lookup = "0.6.0"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
n0-future = "0.3"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# timeBeginPeriod (see `fine_timers`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1.0.151"
bytes = "1.12"
tokio = { version = "1.53.2", features = ["full"] }

[lints]
workspace = true
