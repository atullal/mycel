[package]
name = "mycel-net"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6.0"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
