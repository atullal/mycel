[package]
name = "mycel-net"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iroh = { version = "1.3", features = ["unstable-custom-transports"] }
iroh-base = "1.3"
bytes = "1.12"
n0-watcher = "1.0"
noq-udp = "1.3"
iroh-mdns-address-lookup = "0.6.0"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
n0-future = "0.3"
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
