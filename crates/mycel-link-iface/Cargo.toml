[package]
name = "mycel-link-iface"
description = "Any-network-interface link for Mycel: each radio or cable the OS exposes (UWB / 802.15.4, Wi-Fi Direct, Thread, a second NIC, ...) becomes its own QUIC path"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-net = { version = "0.1.0", path = "../mycel-net" }
parking_lot = "0.12.5"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.2", features = ["net", "rt", "sync", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
mycel-sync = { version = "0.1.0", path = "../mycel-sync" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
