[package]
name = "mycel-crypto"
description = "Mycel cryptographic primitives: thin wrappers over vetted crates (Ed25519, HPKE, XChaCha20-Poly1305, BLAKE3)"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde", "zeroize"] }
getrandom = "0.4.3"
hex = "0.4.3"
hpke = "0.14.1"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
zeroize = "1.9.1"
