[package]
name = "mycel-video"
description = "Live video for Mycel calls: camera, hardware H.264, frames on QUIC streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Never published: it builds against the patched crates in vendor/, which a
# crates.io copy would silently replace with unpatched upstream.
publish = false

[dependencies]
anyhow = "1.0.104"
bytes = "1.12"
mycel-net = { version = "0.1.0", path = "../mycel-net" }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["sync", "time", "rt", "macros"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
# real-time scheduling of media threads (src/realtime.rs)
libc = "0.2.189"
mach2 = "0.4.3"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-video", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVCaptureSession", "AVCaptureSessionPreset", "AVMediaFormat"] }
# only for the type in the capture delegate's signature; the CoreMedia,
# CoreVideo and VideoToolbox calls are declared in src/mac/ffi.rs
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSArray"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["full"] }
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }

[lints]
workspace = true
