[package]
name = "mycel-sync"
description = "Mycel data and sync: signed, encrypted envelopes materialized into Automerge Docs and Feeds"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Pinned: bounded_change.rs, change_resources.rs and change_ops.rs re-implement
# automerge 0.12's private change framing and column encodings to bound and
# validate untrusted changes before upstream parses them. Before upgrading,
# re-audit them against the new storage/ and columnar/ code; the tests in
# bounded_change.rs (automerge_format) fail on any other locked version or on
# any change in how automerge encodes the audited fixtures.
automerge = "=0.12.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
leb128 = "0.2.7"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
