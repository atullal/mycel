[package]
name = "mycel-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
automerge = "0.12.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
leb128 = "0.2.7"
mycel-crypto = { version = "0.1.0", path = "../mycel-crypto" }
mycel-trust = { version = "0.1.0", path = "../mycel-trust" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
