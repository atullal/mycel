[package]
name = "mycel-rules-abi"
version = "0.1.0"
edition = "2024"
description = "Shared no_std ABI types between the Mycel rules host (mycel-rules) and wasm guests."

[features]
# Example payload types for the messaging app's message feed (used by chat-rules and host tests).
chat = []

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
# Byte strings (de)serialize as one blob instead of per element: same postcard bytes, far less guest fuel.
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }
