[package]
name = "mycel-cli"
description = "Run a Mycel device from the terminal: a full device with the web UI, or an always-on keeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "mycel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12"
clap = { version = "4.6.7", features = ["derive"] }
mycel-node = { version = "0.1.0", path = "../mycel-node" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
