# cargo-deny: supply-chain policy for the Rust dependency graph.
# https://embarkstudios.github.io/cargo-deny/
#
#   cargo deny check
#   cargo deny --manifest-path rules/Cargo.toml --target wasm32-unknown-unknown check \
#     -A license-exception-not-encountered -A license-not-encountered -A advisory-not-detected
#
# (The rules workspace shares this policy; the -A flags silence the
# exceptions it has no use for.) CI runs both: .github/workflows/ci.yml.
#
# Every exception below says why it is there. Remove it when the reason goes.

[graph]
# The platforms Mycel ships on. Dependencies used only elsewhere (iroh's
# WebAssembly transport, say) are left out.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerabilities are always errors. Unmaintained and unsound crates anywhere
# in the graph are errors too, and so are yanked versions.
unmaintained = "all"
unsound = "all"
yanked = "deny"
#
# Each ignore names the one advisory, why Mycel isn't exposed, and when to
# look again. The same list is in .cargo/audit.toml for `cargo audit`.
ignore = [
  # Unsound `Iterator` impls of glib::VariantStrIter (fixed in glib 0.20).
  # Linux only: glib 0.18 comes with Tauri's GTK 3 webview (wry 0.57 and
  # tao 0.37 need gtk 0.18; webkit2gtk is pinned at =2.0.2, also gtk 0.18).
  # No Tauri release uses gtk 0.19 yet (tauri-apps/wry#1841 is open). No
  # code in this repository or in any crate between us and glib calls
  # VariantStrIter or Variant::array_iter_str (grep, 2026-10-20).
  # Review by 2027-01-31, or when wry moves to gtk 0.19.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 via Tauri's GTK 3 webview on Linux; VariantStrIter unused; no fixed version Tauri can use" },
  # "Unmaintained" notices, not vulnerabilities: zbus 6.0 (2026-10-16)
  # merged zvariant, zvariant_derive and zbus_names into itself. Linux only.
  # zbus 5 stays in the graph through notify-rust 4.18 and
  # tauri-plugin-opener 2.7 (both `zbus ^5`, no zbus 6 release yet), so
  # moving mycel-link-iface alone would only add a second D-Bus stack.
  # Review by 2027-01-31, or when both have moved: then move
  # mycel-link-iface to zbus 6 too.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; zbus 5 still required by notify-rust and tauri-plugin-opener (Linux)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; zbus 5 still required by notify-rust and tauri-plugin-opener (Linux)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; zbus 5 still required by notify-rust and tauri-plugin-opener (Linux)" },
  # Compile-time only: proc macros of glib-macros 0.18 (Tauri on Linux) and
  # of netlink-packet-core (Iroh's network monitor on Linux and Android).
  # Neither runs in the shipped binaries. No maintained drop-in release yet.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time only, via glib-macros 0.18 (Tauri, Linux)" },
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time only, via netlink-packet-core (Iroh netwatch, Linux/Android)" },
]

[licenses]
# Permissive licences compatible with distributing Mycel under MIT OR
# Apache-2.0. Anything else, copyleft included, fails until reviewed and
# listed under `exceptions` for the one crate that needs it.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
exceptions = [
  # MPL-2.0 is file-level copyleft: MPL files used unmodified can ship inside
  # an MIT/Apache work, and their source stays available on crates.io.
  { allow = ["MPL-2.0"], crate = "attohttpc" },        # Iroh's portmapper (UPnP)
  { allow = ["MPL-2.0"], crate = "option-ext" },       # dirs-sys, via Tauri
  { allow = ["MPL-2.0"], crate = "cssparser" },        # build time only: tauri-build
  { allow = ["MPL-2.0"], crate = "cssparser-macros" }, # build time only: tauri-build
  { allow = ["MPL-2.0"], crate = "dtoa-short" },       # build time only: tauri-build
  { allow = ["MPL-2.0"], crate = "selectors" },        # build time only: tauri-build
  # Mozilla's root certificates, as data, for the TLS of Iroh's relays.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[licenses.private]
# Crates with `publish = false` are ours, MIT OR Apache-2.0 via the workspace.
ignore = true

[bans]
# Duplicates come from the ecosystem (windows-sys, syn, ...): visible, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version requirement.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
# crates.io only. Vendored crates are path dependencies (vendor/, see
# THIRD_PARTY_NOTICES.md); no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
