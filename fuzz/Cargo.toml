# libFuzzer targets for every decoder of untrusted bytes (docs/TESTING.md,
# "Fuzzing"). A workspace of its own, excluded from the main one: cargo-fuzz
# needs a nightly toolchain, and stable builds must never see these crates.
#
#   cargo +nightly fuzz build -a          # all targets, debug assertions on
#   cargo +nightly fuzz run -a mesh_wire  # one target
[package]
name = "mycel-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
automerge = "=0.12.0"
bytes = "1.12"
libfuzzer-sys = "0.4.13"
mycel-call = { path = "../crates/mycel-call" }
mycel-crypto = { path = "../crates/mycel-crypto" }
mycel-kit-chat = { path = "../crates/mycel-kit-chat" }
mycel-link-awdl = { path = "../crates/mycel-link-awdl" }
mycel-link-ble = { path = "../crates/mycel-link-ble" }
mycel-link-iface = { path = "../crates/mycel-link-iface" }
mycel-net = { path = "../crates/mycel-net" }
mycel-node = { path = "../crates/mycel-node" }
mycel-rules = { path = "../crates/mycel-rules" }
mycel-rules-abi = { path = "../crates/mycel-rules-abi", features = ["chat"] }
mycel-sync = { path = "../crates/mycel-sync" }
mycel-trust = { path = "../crates/mycel-trust" }
mycel-video = { path = "../crates/mycel-video" }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
wasm-smith = { version = "0.261", features = ["wasmparser"] }
wasmparser = "0.261"
wat = { version = "1.228.0", default-features = false }

# For `examples/seeds.rs`, which writes the seed corpora (not a fuzz target).
[dev-dependencies]
leb128 = "0.2.7"

# The same patched crates the main workspace builds against (see the root
# Cargo.toml for why each is patched). A patch only applies from the root of
# the workspace being built, so it is repeated here.
[patch.crates-io]
iroh = { path = "../vendor/iroh" }
noq = { path = "../vendor/noq" }
noq-proto = { path = "../vendor/noq-proto" }
swarm-discovery = { path = "../vendor/swarm-discovery" }

# cargo-fuzz builds with --release. Symbols for readable crash stacks; no LTO
# (link time would dominate a fuzzing build).
[profile.release]
debug = 1
codegen-units = 16
incremental = false

# As in the main workspace's profiles: Automerge's counters wrap, as they do
# in release builds (see the root Cargo.toml). Naming debug assertions here
# makes Cargo pass the overflow-checks setting explicitly, so cargo-fuzz's
# `-Cdebug-assertions` doesn't turn them back on.
[profile.release.package.automerge]
debug-assertions = true
overflow-checks = false

# Each target, in alphabetical order. `test`, `doc` and `bench` are off: they
# are libFuzzer binaries, not test harnesses.
[[bin]]
name = "blob_ranges"
path = "fuzz_targets/blob_ranges.rs"
test = false
doc = false
bench = false

