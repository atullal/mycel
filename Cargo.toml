[workspace]
resolver = "3"
members = ["crates/*", "apps/host/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

# Keep build artifacts small (disk is nearly full); line tables still give useful backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
