[workspace]
resolver = "3"
members = ["crates/*", "apps/host/src-tauri", "bench/mycel-bench"]

[workspace.package]
edition = "2024"
version = "0.0.1"
# Kept equal to the toolchain pinned in rust-toolchain.toml: bump both together.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["The Mycel contributors"]
repository = "https://github.com/atullal/mycel"
homepage = "https://github.com/atullal/mycel"

# Versions shared by several first-party crates.
[workspace.dependencies]
# getifaddrs without hand-rolled pointer walks. 0.31.3 is already in
# Cargo.lock (via zip and zbus), so this adds no new crate version.
nix = { version = "0.31.3", default-features = false, features = ["net"] }

# Shared by every first-party crate (`[lints] workspace = true`); the rules
# workspace has its own copy. CI runs clippy with `-D warnings`, so "warn"
# fails CI too. Only lints the code passes today: add stricter ones (such as
# clippy::undocumented_unsafe_blocks) together with the fixes they need.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Identifiers are ASCII: no look-alike Unicode names.
non_ascii_idents = "deny"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Debugging leftovers and unfinished code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Safety comments and docs must be where they belong.
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Correctness and clarity.
checked_conversions = "warn"
debug_assert_with_mut_call = "warn"
empty_drop = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_as_bytes = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
unnecessary_self_imports = "warn"

# Line tables only: keeps target/ small and still gives useful backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Attachments stream through these: unoptimized they run at a few MB/s, which
# makes debug builds and tests with large files crawl.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
# (the AEAD's generic code is instantiated here)
[profile.dev.package.mycel-crypto]
opt-level = 3
# Every membership op and envelope is signature-checked, and documents are
# Automerge: unoptimized, tests with long histories or large documents crawl.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.automerge]
opt-level = 3
# Its internal debug assertions walk whole documents on every edit: typing
# grows quadratic in tests (flat in release), hiding our own costs.
debug-assertions = false
[profile.dev.package.hexane]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
# Live calls encode and decode audio in real time: the Opus codec and the call
# pipeline must be optimized even in debug builds.
[profile.dev.package.unsafe-libopus]
opt-level = 3
[profile.dev.package.mycel-call]
opt-level = 2
# ...and video draws, encodes and moves frames 30 times a second.
[profile.dev.package.mycel-video]
opt-level = 2
# The simulator runs thousands of routers in virtual time in its CI tests.
[profile.dev.package.mycel-sim]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The benchmark replays (bench/mycel-bench) are compute-bound: speed, not
# size, and symbols for profiling. `cargo build --profile replay -p mycel-bench`
[profile.replay]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = false
debug = "line-tables-only"

# Iroh 1.3 with one change: custom-transport addresses (peer-to-peer Wi-Fi,
# Bluetooth) are opened as backup paths on every connection, so a live
# connection can move to them when its path dies; and several paths can be
# Available at once (bandwidth aggregation). See vendor/iroh/MYCEL_PATCH.md.
# noq 1.3 / noq-proto 1.3 (Iroh's QUIC) with a crash fix: a late HANDSHAKE_DONE
# after path 0 was abandoned panicked, and the panic aborted the process. See
# vendor/noq-proto/MYCEL_PATCH.md.
# swift-rs 1.0.8 with an Xcode 27 link fix for the iOS app
# (vendor/swift-rs/MYCEL_PATCH.md).
[patch.crates-io]
iroh = { path = "vendor/iroh" }
swift-rs = { path = "vendor/swift-rs" }
noq = { path = "vendor/noq" }
noq-proto = { path = "vendor/noq-proto" }
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
# standard DNS-SD interop for LAN discovery (vendor/swarm-discovery/MYCEL_PATCH.md)
swarm-discovery = { path = "vendor/swarm-discovery" }
