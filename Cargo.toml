[workspace]
resolver = "3"
members = ["crates/*", "apps/host/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

# Keep build artifacts small (disk is nearly full); line tables still give useful backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Attachments stream through these: unoptimized they run at a few MB/s, which
# makes debug builds and tests with large files crawl.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
# (the AEAD's generic code is instantiated here)
[profile.dev.package.mycel-crypto]
opt-level = 3
# Live calls encode and decode audio in real time: the Opus codec and the call
# pipeline must be optimized even in debug builds.
[profile.dev.package.unsafe-libopus]
opt-level = 3
[profile.dev.package.mycel-call]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Iroh 1.3 with one change: custom-transport addresses (peer-to-peer Wi-Fi,
# Bluetooth) are opened as backup paths on every connection, so a live
# connection can move to them when its path dies. See vendor/iroh/MYCEL_PATCH.md.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
