[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT OR Apache-2.0"

# Keep build artifacts small (disk is nearly full); line tables still give useful backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
